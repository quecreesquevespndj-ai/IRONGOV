<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://i.postimg.cc https://files.catbox.moe; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; connect-src 'self' https://cdnjs.cloudflare.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests;">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#020005">
<title>EXPEDIENTES — IRON ATLAS NG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
/* ============ RESET & BASE ============ */
:root{
  --bg-void:#020005;
  --bg-deep:#0a0010;
  --neon-red:#ff003c;
  --neon-crimson:#dc143c;
  --neon-magenta:#ff00aa;
  --neon-cyan:#00f0ff;
  --neon-purple:#a855f7;
  --text-light:#ffe6ee;
  --text-muted:#8a7080;
  --card-bg:rgba(12,0,18,0.72);
  --glass-border:rgba(255,0,60,0.22);
  --radius:clamp(16px,1.8vw,24px);
  --radius-sm:clamp(10px,1.2vw,14px);
  --font-display:'Orbitron',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --ease-out-expo:cubic-bezier(.19,1,.22,1);
  --ease-spring:cubic-bezier(.2,.9,.3,1.4);
  --nav-h:clamp(56px,8vh,68px);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',system-ui,sans-serif;user-select:none;-webkit-user-drag:none;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
body{
  background:var(--bg-void);
  color:#fff;
  overflow-x:hidden;
  min-height:100vh;
  min-height:100dvh;
  line-height:1.6;
  letter-spacing:.01em;
}
img{max-width:100%;height:auto;display:block;}
::selection{background:var(--neon-red);color:#fff;}

/* ============ SCROLLBAR ============ */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:rgba(10,0,16,.9);}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--neon-red),var(--neon-crimson));border-radius:8px;box-shadow:0 0 10px var(--neon-red);}
::-webkit-scrollbar-thumb:hover{background:var(--neon-red);}

/* ============ CANVAS 3D ============ */
#bg-canvas{
  position:fixed;inset:0;
  width:100vw;height:100vh;
  z-index:0;pointer-events:none;display:block;
}

/* ============ OVERLAYS ============ */
.cinematic-overlay{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 0%,transparent 30%,rgba(2,0,5,.75) 100%);
}
.vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 0%,transparent 38%,rgba(2,0,5,.95) 100%);
}
.scanlines{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,0,60,0.028) 0px,rgba(255,0,60,0.028) 1px,transparent 1px,transparent 3px);
  mix-blend-mode:overlay;
  animation:scanShift 10s linear infinite;
}
@keyframes scanShift{0%{background-position:0 0;}100%{background-position:0 100vh;}}

.grid-overlay{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.4;
  background-image:
    linear-gradient(rgba(255,0,60,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,0,60,.04) 1px,transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(ellipse at center,black 0%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse at center,black 0%,transparent 75%);
  animation:gridPulse 6s ease-in-out infinite;
}
@keyframes gridPulse{0%,100%{opacity:.3;}50%{opacity:.5;}}

/* Letterbox */
.letterbox-top,.letterbox-bottom{
  position:fixed;left:0;right:0;
  height:clamp(20px,4vh,50px);
  background:#000;z-index:90;pointer-events:none;
  transition:height .6s var(--ease-out-expo);
}
.letterbox-top{top:0;border-bottom:1px solid rgba(255,0,60,.3);}
.letterbox-bottom{bottom:0;border-top:1px solid rgba(255,0,60,.3);}
.letterbox-top.collapsed,.letterbox-bottom.collapsed{height:0;border:none;}

/* Scroll progress */
.scroll-progress{
  position:fixed;top:0;left:0;height:3px;width:0%;
  background:linear-gradient(90deg,var(--neon-crimson),var(--neon-red),var(--neon-magenta),#fff);
  box-shadow:0 0 12px var(--neon-red),0 0 24px var(--neon-red),0 0 48px rgba(255,0,170,.5);
  z-index:200;transition:width .12s linear;will-change:width;
}

/* ============ NAV ============ */
.top-nav{
  position:fixed;top:clamp(20px,4vh,50px);left:0;right:0;
  display:flex;justify-content:space-between;align-items:center;
  padding:clamp(.7rem,1.6vw,1.2rem) clamp(.9rem,3vw,3rem);
  background:rgba(2,0,5,.78);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid rgba(255,0,60,.25);
  z-index:100;
  transition:padding .4s var(--ease-out-expo),background .4s,box-shadow .4s,top .6s var(--ease-out-expo);
  padding-top:calc(clamp(.7rem,1.6vw,1.2rem) + env(safe-area-inset-top,0px));
}
.top-nav.scrolled{
  top:0;
  padding-top:calc(clamp(.45rem,1.2vw,.75rem) + env(safe-area-inset-top,0px));
  padding-bottom:clamp(.45rem,1.2vw,.75rem);
  background:rgba(2,0,5,.96);
  box-shadow:0 8px 50px rgba(255,0,60,.4),0 0 0 1px rgba(255,0,60,.2);
}
.nav-brand{
  display:flex;align-items:center;gap:.7rem;text-decoration:none;
  transition:transform .4s var(--ease-spring);position:relative;
}
.nav-brand:hover{transform:scale(1.06);}
.nav-title{
  font-family:var(--font-display);
  font-size:clamp(1rem,2.4vw,1.6rem);
  font-weight:900;color:#fff;
  letter-spacing:clamp(2px,.5vw,4px);
  text-shadow:0 0 10px var(--neon-red),0 0 25px rgba(255,0,60,.6),0 0 50px rgba(255,0,170,.3);
  animation:flicker 5s infinite alternate;
  background:linear-gradient(135deg,#fff 0%,var(--text-light) 40%,var(--neon-red) 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 12px rgba(255,0,60,.8));
}
@keyframes flicker{
  0%,100%{opacity:1;}
  47%{opacity:1;}
  49%{opacity:.7;filter:drop-shadow(0 0 30px #fff) drop-shadow(0 0 60px var(--neon-red));}
  51%{opacity:1;}
}
.nav-brand::after{
  content:'';position:absolute;left:0;bottom:-6px;width:100%;height:1px;
  background:linear-gradient(90deg,transparent,var(--neon-red),transparent);
  transform:scaleX(0);transition:transform .5s var(--ease-out-expo);
}
.nav-brand:hover::after{transform:scaleX(1);}

.nav-links{display:flex;gap:clamp(1rem,2.4vw,3rem);}
.nav-link{
  font-family:var(--font-display);
  color:var(--text-light);text-decoration:none;
  font-size:clamp(.7rem,1.1vw,.95rem);
  font-weight:700;letter-spacing:clamp(1px,.3vw,2px);
  text-transform:uppercase;position:relative;
  padding:.4rem 0;transition:color .3s,transform .3s;
}
.nav-link::before{
  content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--neon-red);
  opacity:0;transition:opacity .3s,box-shadow .3s;
}
.nav-link::after{
  content:'';position:absolute;bottom:-2px;left:0;
  width:100%;height:2px;background:var(--neon-red);
  transform:scaleX(0);transform-origin:right;
  transition:transform .5s var(--ease-spring);
  box-shadow:0 0 8px var(--neon-red);
}
.nav-link:hover{color:#fff;transform:translateY(-2px);text-shadow:0 0 12px var(--neon-red);}
.nav-link:hover::before{opacity:1;box-shadow:0 0 8px var(--neon-red);}
.nav-link:hover::after{transform:scaleX(1);transform-origin:left;}
.nav-link.active{color:#fff;text-shadow:0 0 15px var(--neon-red),0 0 30px var(--neon-red);}
.nav-link.active::after{transform:scaleX(1);transform-origin:left;}
.nav-link.active::before{opacity:1;box-shadow:0 0 8px var(--neon-red);}

.hamburger{
  display:none;flex-direction:column;gap:5px;
  padding:10px;background:transparent;border:none;cursor:pointer;z-index:101;
}
.hamburger span{
  display:block;width:26px;height:3px;background:var(--neon-red);
  border-radius:2px;box-shadow:0 0 8px var(--neon-red);
  transition:transform .4s var(--ease-spring),opacity .4s,width .4s;
}
.hamburger.active span:nth-child(1){transform:translateY(8px) rotate(45deg);}
.hamburger.active span:nth-child(2){opacity:0;width:0;}
.hamburger.active span:nth-child(3){transform:translateY(-8px) rotate(-45deg);}

/* ============ MAIN ============ */
.main-content{
  position:relative;z-index:5;width:100%;max-width:1580px;
  margin:0 auto;
  padding:clamp(8rem,14vw,13rem) clamp(1rem,3vw,2rem) 6rem;
  display:flex;flex-direction:column;align-items:center;
}

/* ============ HERO ============ */
.page-head{
  text-align:center;margin-bottom:clamp(2rem,4vw,3rem);
  width:100%;max-width:1000px;
}
.page-head h1{
  font-family:var(--font-display);
  font-size:clamp(2rem,7vw,5.5rem);
  font-weight:900;letter-spacing:clamp(4px,2vw,16px);
  text-transform:uppercase;color:#fff;
  margin-bottom:clamp(.8rem,2vw,1.5rem);
  display:flex;flex-wrap:wrap;justify-content:center;
  line-height:1.05;transform-style:preserve-3d;
}
.page-head h1 .letter{
  display:inline-block;
  background:linear-gradient(180deg,#fff 0%,var(--text-light) 50%,var(--neon-red) 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,0,60,.6)) drop-shadow(0 0 40px rgba(255,0,60,.45));
  animation:letterIn .8s var(--ease-spring) both,letterGlow 4s ease-in-out infinite;
  will-change:transform,opacity;transform-style:preserve-3d;
}
@keyframes letterIn{
  0%{opacity:0;transform:translateY(80px) translateZ(-150px) rotateX(-90deg);}
  100%{opacity:1;transform:translateY(0) translateZ(0) rotateX(0);}
}
@keyframes letterGlow{
  0%,100%{filter:drop-shadow(0 0 18px rgba(255,0,60,.6)) drop-shadow(0 0 40px rgba(255,0,60,.45));}
  50%{filter:drop-shadow(0 0 30px #fff) drop-shadow(0 0 70px var(--neon-red)) drop-shadow(0 0 120px var(--neon-red));}
}
.page-head h1 .space{width:.3em;}

.page-head .subtitle{
  font-family:var(--font-mono);
  font-size:clamp(.7rem,1.4vw,.9rem);
  color:var(--text-muted);
  letter-spacing:clamp(2px,.5vw,4px);
  text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.8rem;
  padding:.5rem 1.2rem;
  border:1px solid rgba(255,0,60,.3);
  border-radius:100px;
  background:rgba(255,0,60,.05);
  position:relative;
  animation:borderPulse 4s infinite alternate;
}
.page-head .subtitle::before,
.page-head .subtitle::after{
  content:'';width:6px;height:6px;border-radius:50%;
  background:var(--neon-red);box-shadow:0 0 10px var(--neon-red);
  animation:dotPulse 1.8s ease-in-out infinite;
}
.page-head .subtitle::after{animation-delay:.9s;}
@keyframes dotPulse{
  0%,100%{transform:scale(1);opacity:1;}
  50%{transform:scale(1.6);opacity:.5;}
}
@keyframes borderPulse{
  0%{border-color:rgba(255,0,60,.25);box-shadow:0 0 20px rgba(255,0,60,.1);}
  100%{border-color:var(--neon-red);box-shadow:0 0 35px rgba(255,0,60,.35);}
}

/* ============ SEARCH ============ */
.search-section{
  width:100%;max-width:680px;
  margin-bottom:clamp(1.5rem,3vw,2.2rem);
  position:relative;
  opacity:0;transform:translateY(30px);
  animation:searchIn 1s var(--ease-out-expo) .6s forwards;
}
@keyframes searchIn{to{opacity:1;transform:translateY(0);}}

.search-wrap{
  position:relative;width:100%;
}
.search-icon-svg{
  position:absolute;left:clamp(1rem,2vw,1.4rem);top:50%;
  transform:translateY(-50%);
  width:18px;height:18px;color:var(--neon-red);
  pointer-events:none;z-index:2;
  filter:drop-shadow(0 0 8px var(--neon-red));
  transition:color .3s,transform .3s;
}
#search{
  width:100%;
  padding:clamp(1rem,2vw,1.15rem) 3.5rem clamp(1rem,2vw,1.15rem) clamp(3rem,5vw,3.4rem);
  background:rgba(12,0,18,.85);
  border:1.5px solid var(--glass-border);
  border-radius:100px;
  color:#fff;
  font-family:'Inter',sans-serif;
  font-size:clamp(.9rem,1.4vw,1rem);
  font-weight:500;
  outline:none;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:0 10px 40px rgba(255,0,60,.15),inset 0 1px 0 rgba(255,255,255,.05);
  transition:border-color .4s,box-shadow .4s,transform .3s var(--ease-spring);
  letter-spacing:.3px;
}
#search::placeholder{color:var(--text-muted);font-weight:400;}
#search:focus{
  border-color:var(--neon-cyan);
  box-shadow:0 15px 50px rgba(0,240,255,.25),0 0 0 4px rgba(0,240,255,.08),inset 0 1px 0 rgba(255,255,255,.08);
  transform:translateY(-2px);
}
#search:focus + .search-icon-svg,
.search-section:focus-within .search-icon-svg{
  color:var(--neon-cyan);transform:translateY(-50%) scale(1.15);
  filter:drop-shadow(0 0 10px var(--neon-cyan));
}

#clr{
  display:none;
  position:absolute;right:clamp(.9rem,1.8vw,1.2rem);top:50%;
  transform:translateY(-50%);
  background:rgba(255,0,60,.15);
  border:1px solid var(--glass-border);
  border-radius:50%;
  width:28px;height:28px;
  cursor:pointer;
  color:var(--neon-red);
  font-size:.8rem;font-weight:700;
  align-items:center;justify-content:center;
  transition:background .3s,transform .3s var(--ease-spring),box-shadow .3s;
  z-index:3;
  font-family:var(--font-mono);
}
#clr:hover{
  background:rgba(255,0,60,.35);
  transform:translateY(-50%) scale(1.15) rotate(90deg);
  box-shadow:0 0 20px rgba(255,0,60,.6);
}

/* Search hint */
.search-hint{
  display:flex;flex-wrap:wrap;justify-content:center;
  gap:.5rem;margin-top:1rem;
  animation:fadeIn .6s var(--ease-out-expo) 1s both;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.hint-chip{
  font-family:var(--font-mono);
  font-size:clamp(.6rem,1vw,.72rem);
  color:var(--text-muted);
  background:rgba(255,0,60,.06);
  border:1px solid rgba(255,0,60,.2);
  padding:.3rem .7rem;border-radius:100px;
  cursor:pointer;
  transition:all .35s var(--ease-spring);
  text-transform:uppercase;letter-spacing:1px;
  user-select:none;
}
.hint-chip:hover{
  color:#fff;border-color:var(--neon-red);
  background:rgba(255,0,60,.2);
  transform:translateY(-2px);
  box-shadow:0 0 15px rgba(255,0,60,.4);
}

/* ============ COUNTER BAR ============ */
.counter-bar{
  display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
  gap:clamp(.8rem,2vw,2rem);
  padding:clamp(.7rem,1.5vw,1rem) clamp(1.2rem,3vw,2.2rem);
  background:var(--card-bg);
  border:1px solid var(--glass-border);
  border-radius:100px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  margin-bottom:clamp(2rem,4vw,3rem);
  font-family:var(--font-mono);
  font-size:clamp(.7rem,1.1vw,.82rem);
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--text-muted);
  position:relative;overflow:hidden;
}
.counter-bar::before{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,0,60,.08),transparent);
  animation:shine 4s ease-in-out infinite;
}
@keyframes shine{
  0%{left:-100%;}
  50%,100%{left:100%;}
}
.counter-item{
  display:inline-flex;align-items:center;gap:.5rem;
  position:relative;z-index:2;
}
.counter-item .label{color:var(--text-muted);}
.counter-item .value{
  color:#fff;font-weight:700;
  text-shadow:0 0 10px var(--neon-red);
  font-family:var(--font-display);
  font-size:clamp(.85rem,1.3vw,1rem);
}
.counter-item .value.cyan{
  color:var(--neon-cyan);
  text-shadow:0 0 10px var(--neon-cyan);
}
.counter-divider{
  width:1px;height:14px;
  background:linear-gradient(180deg,transparent,rgba(255,0,60,.5),transparent);
}

/* ============ GRID ============ */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));
  gap:clamp(1.2rem,2.4vw,2rem);
  width:100%;
}

/* ============ CARD ============ */
.card{
  background:var(--card-bg);
  border:1px solid rgba(255,0,60,.22);
  border-radius:var(--radius);
  overflow:hidden;cursor:pointer;
  transition:transform .5s var(--ease-spring),box-shadow .6s,border-color .6s,background .6s;
  position:relative;
  backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  box-shadow:0 10px 30px rgba(255,0,60,.12),inset 0 1px 0 rgba(255,255,255,.05);
  contain:layout paint;transform:translateZ(0);
  opacity:0;
  animation:cardIn .55s var(--ease-out-expo) forwards;
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(30px) scale(.96);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
.card::after{
  content:'';position:absolute;inset:0;border-radius:var(--radius);
  background:linear-gradient(135deg,rgba(255,0,60,.08),transparent 55%,rgba(0,240,255,.05));
  opacity:0;transition:opacity .5s;pointer-events:none;z-index:1;
}
.card:hover::after{opacity:1;}
.card:hover{
  border-color:rgba(0,240,255,.5);
  box-shadow:0 28px 65px rgba(255,0,60,.35),0 0 55px rgba(0,240,255,.12),0 0 0 1px rgba(0,240,255,.1);
  transform:translateY(-10px) scale(1.02);
}
.card:focus-visible{outline:2px solid var(--neon-cyan);outline-offset:3px;}

/* Card corners */
.card .corner{
  position:absolute;width:14px;height:14px;
  border:2px solid var(--neon-red);opacity:0;
  transition:opacity .4s,transform .4s var(--ease-spring);
  pointer-events:none;z-index:5;
}
.card .corner.tl{top:8px;left:8px;border-right:none;border-bottom:none;transform:translate(-6px,-6px);}
.card .corner.tr{top:8px;right:8px;border-left:none;border-bottom:none;transform:translate(6px,-6px);}
.card .corner.bl{bottom:8px;left:8px;border-right:none;border-top:none;transform:translate(-6px,6px);}
.card .corner.br{bottom:8px;right:8px;border-left:none;border-top:none;transform:translate(6px,6px);}
.card:hover .corner{opacity:1;transform:translate(0,0);}
.card:hover .corner.tl,.card:hover .corner.tr{border-color:var(--neon-cyan);}
.card:hover .corner.bl,.card:hover .corner.br{border-color:var(--neon-cyan);}

/* Thumb */
.thumb{
  position:relative;
  aspect-ratio:1/1;
  overflow:hidden;
  background:linear-gradient(135deg,#0a0010,#020005);
}
.thumb img{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .8s var(--ease-out-expo),filter .5s ease;
  filter:brightness(.85) contrast(1.05);
}
.card:hover .thumb img{
  transform:scale(1.15);
  filter:brightness(1.15) saturate(1.4) contrast(1.08);
}

.thumb-grad{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(2,0,5,1) 0%,rgba(2,0,5,.4) 45%,transparent 100%);
  pointer-events:none;z-index:1;
}

.scanlines-thumb{
  position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.12) 3px,rgba(0,0,0,.12) 4px);
  transition:opacity .5s;
}
.card:hover .scanlines-thumb{opacity:1;animation:scanMove 5s linear infinite;}

      '<div class="scanlines-thumb"></div>' +
      '<div class="glitch-bar"></div>' +
      '<span class="id-pill">' + highlightMatch(exp.id, query) + '</span>' +
      '<span class="status-dot" aria-hidden="true"></span>' +
    '</div>' +
    '<div class="card-body">' +
      '<div class="card-name">' + highlightMatch(exp.nombre, query) + '</div>' +
      '<div class="card-username">' + highlightMatch(exp.username, query) + '</div>' +
      '<button class="card-btn" type="button">Ver Expediente <span class="arrow">→</span></button>' +
    '</div>' +
    '<span class="corner tl"></span><span class="corner tr"></span>' +
    '<span class="corner bl"></span><span class="corner br"></span>';

  const btn = art.querySelector('.card-btn');
  btn.addEventListener('click', function(e){ e.stopPropagation(); go(exp.archivo); });
  art.addEventListener('click', function(){ go(exp.archivo); });
  art.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(exp.archivo); }
  });
  return art;
}

function render(list, query){
  grid.innerHTML = '';
  if (cntEl) cntEl.textContent = list.length;
  if (statusEl) {
    statusEl.textContent = list.length ? 'ACTIVO' : 'VACÍO';
    statusEl.style.color = list.length ? '' : 'var(--neon-cyan)';
  }

  if (!list.length) {
    const d = document.createElement('div');
    d.className = 'empty';
    d.innerHTML = '<span class="empty-icon">[ ∅ ]</span><p>Sin resultados // intenta otra búsqueda</p>';
    grid.appendChild(d);
    return;
  }
  const f = document.createDocumentFragment();
  list.forEach((exp, i) => f.appendChild(buildCard(exp, i, query)));
  grid.appendChild(f);
}

function filter(term){
  if (!term) return DATA;
  const q = term.toLowerCase().trim();
  const qNum = q.replace(/\D/g,'');
  return DATA.filter(e => {
    if (e._id.includes(q)) return true;
    if (qNum && e._id.includes(qNum)) return true;
    if (e._name.includes(q)) return true;
    if (e._user.includes(q)) return true;
    return false;
  });
}

let dbt;
let lastQuery = '';

function doSearch(value){
  const q = value.trim();
  if (q === lastQuery) return;
  lastQuery = q;
  clrBtn.style.display = q ? 'flex' : 'none';
  clearTimeout(dbt);
  dbt = setTimeout(() => render(filter(q), q), 80);
}

searchEl.addEventListener('input', function(){
  doSearch(this.value);
});

clrBtn.addEventListener('click', function(){
  searchEl.value = '';
  lastQuery = '';
  this.style.display = 'none';
  render(DATA, '');
  searchEl.focus();
});

// Hint chips
if (searchHint) {
  searchHint.addEventListener('click', function(e){
    const chip = e.target.closest('.hint-chip');
    if (!chip) return;
    const hint = chip.dataset.hint || '';
    if (hint === 'ID') {
      searchEl.value = '8';
    } else if (hint === 'nombre') {
      searchEl.value = 'a';
    } else {
      searchEl.value = '@';
    }
    searchEl.focus();
    doSearch(searchEl.value);
  });
}

// Keyboard: "/" focuses search
document.addEventListener('keydown', function(e){
  if (e.key === '/' && document.activeElement !== searchEl) {
    e.preventDefault();
    searchEl.focus();
  }
  if (e.key === 'Escape' && document.activeElement === searchEl) {
    searchEl.value = '';
    doSearch('');
    searchEl.blur();
  }
});

// ============ NAV & SCROLL ============
const mobileMenuBtn = document.getElementById('mobile-menu');
const navLinksEl = document.getElementById('nav-links');
if (mobileMenuBtn && navLinksEl) {
  mobileMenuBtn.addEventListener('click', function () {
    const open = navLinksEl.classList.toggle('active');
    mobileMenuBtn.classList.toggle('active', open);
    mobileMenuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  navLinksEl.addEventListener('click', function (e) {
    if (e.target.classList.contains('nav-link')) {
      navLinksEl.classList.remove('active');
      mobileMenuBtn.classList.remove('active');
      mobileMenuBtn.setAttribute('aria-expanded', 'false');
    }
  });
}

const topNav = document.getElementById('top-nav');
const toTop = document.getElementById('to-top');
const scrollProgress = document.getElementById('scroll-progress');
const letterboxTop = document.getElementById('letterbox-top');
const letterboxBottom = document.getElementById('letterbox-bottom');
let ticking = false;

function onScroll() {
  if (!ticking) {
    ticking = true;
    requestAnimationFrame(function () {
      const y = window.scrollY;
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const pct = max > 0 ? (y / max) * 100 : 0;
      if (scrollProgress) scrollProgress.style.width = pct + '%';
      if (topNav) topNav.classList.toggle('scrolled', y > 40);
      if (letterboxTop && letterboxBottom) {
        const collapsed = y > 40;
        letterboxTop.classList.toggle('collapsed', collapsed);
        letterboxBottom.classList.toggle('collapsed', collapsed);
      }
      if (toTop) toTop.classList.toggle('show', y > 600);
      ticking = false;
    });
  }
}
window.addEventListener('scroll', onScroll, { passive: true });
onScroll();
if (toTop) toTop.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });

// ============ HERO TITLE SPLIT ============
const pageTitle = document.getElementById('page-title');
if (pageTitle) {
  const text = pageTitle.textContent.trim();
  pageTitle.textContent = '';
  const frag = document.createDocumentFragment();
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    const span = document.createElement('span');
    if (ch === ' ') {
      span.className = 'letter space';
      span.textContent = '\u00A0';
    } else {
      span.className = 'letter';
      span.textContent = ch;
    }
    span.style.animationDelay = (0.06 * i) + 's, ' + (0.3 + 0.06 * i) + 's';
    frag.appendChild(span);
  }
  pageTitle.appendChild(frag);
}

// ============ REVEAL ============
const revealEls = document.querySelectorAll('.reveal');
if ('IntersectionObserver' in window) {
  const obs = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        obs.unobserve(entry.target);
      }
    });
  }, { threshold: 0.08, rootMargin: '0px 0px -60px 0px' });
  revealEls.forEach(function (el) { obs.observe(el); });
} else {
  revealEls.forEach(function (el) { el.classList.add('visible'); });
}

const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const supportsHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

// 3D card tilt
if (supportsHover && !prefersReduced) {
  document.querySelectorAll('.card').forEach(function (card) {
    let raf = 0;
    card.addEventListener('mousemove', function (e) {
      if (raf) return;
      raf = requestAnimationFrame(function () {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const cx = rect.width / 2;
        const cy = rect.height / 2;
        const rx = ((y - cy) / cy) * -7;
        const ry = ((x - cx) / cx) * 7;
        card.style.transform = 'translateY(-10px) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg) scale(1.02)';
        raf = 0;
      });
    });
    card.addEventListener('mouseleave', function () {
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      card.style.transform = '';
    });
  });
}

// Mouse glow
const mouseGlow = document.getElementById('mouse-glow');
if (mouseGlow && supportsHover && !prefersReduced) {
  let glowRaf = 0;
  document.addEventListener('mousemove', function (e) {
    if (glowRaf) return;
    glowRaf = requestAnimationFrame(function () {
      mouseGlow.style.left = e.clientX + 'px';
      mouseGlow.style.top = e.clientY + 'px';
      glowRaf = 0;
    });
  }, { passive: true });
}

// Ripple
if (!prefersReduced) {
  document.addEventListener('click', function (e) {
    const t = e.target;
    if (t.closest('a, button, .telegram-fab, .card')) return;
    const ripple = document.createElement('div');
    ripple.className = 'ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    document.body.appendChild(ripple);
    setTimeout(function () { ripple.remove(); }, 900);
  });
}

// Protect
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
document.addEventListener('keydown', function (e) {
  const k = e.key;
  if (k === 'F12' ||
      (e.ctrlKey && e.shiftKey && (k === 'I' || k === 'J' || k === 'C')) ||
      (e.ctrlKey && k === 'U')) {
    e.preventDefault(); e.stopPropagation(); return false;
  }
});

// Initial render
render(DATA, '');

// ============ THREE.JS 3D BACKGROUND ============
const canvas3d = document.getElementById('bg-canvas');
if (!canvas3d || prefersReduced || typeof THREE === 'undefined') return;

const cores = navigator.hardwareConcurrency || 2;
const mem = navigator.deviceMemory || 4;
const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 768;
const lowEnd = cores <= 4 || mem <= 3 || isMobile;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x020005, 0.001);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 30;

const renderer = new THREE.WebGLRenderer({
  canvas: canvas3d, alpha: true,
  antialias: !lowEnd,
  powerPreference: lowEnd ? 'low-power' : 'high-performance'
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, lowEnd ? 1 : 2));
renderer.setClearColor(0x020005, 1);

const particleCount = lowEnd ? 350 : 900;
const particlesGeometry = new THREE.BufferGeometry();
const particlesPositions = new Float32Array(particleCount * 3);
const particlesColors = new Float32Array(particleCount * 3);

for (let i = 0; i < particleCount; i++) {
  particlesPositions[i * 3] = (Math.random() - 0.5) * 100;
  particlesPositions[i * 3 + 1] = (Math.random() - 0.5) * 70;
  particlesPositions[i * 3 + 2] = (Math.random() - 0.5) * 70;
  const r = Math.random();
  if (r < 0.6) { particlesColors[i*3]=1.0; particlesColors[i*3+1]=0.0; particlesColors[i*3+2]=0.24; }
  else if (r < 0.85) { particlesColors[i*3]=1.0; particlesColors[i*3+1]=0.0; particlesColors[i*3+2]=0.67; }
  else { particlesColors[i*3]=0.0; particlesColors[i*3+1]=0.94; particlesColors[i*3+2]=1.0; }
}
particlesGeometry.setAttribute('position', new THREE.BufferAttribute(particlesPositions, 3));
particlesGeometry.setAttribute('color', new THREE.BufferAttribute(particlesColors, 3));

const particlesMaterial = new THREE.PointsMaterial({
  size: lowEnd ? 0.18 : 0.12,
  vertexColors: true, transparent: true, opacity: 0.8,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
});
const particleSystem = new THREE.Points(particlesGeometry, particlesMaterial);
scene.add(particleSystem);

const rings = [];
const ringCount = lowEnd ? 3 : 5;
for (let i = 0; i < ringCount; i++) {
  const ringGeometry = new THREE.TorusGeometry(8 + i * 4, 0.05, 16, 120);
  const ringMaterial = new THREE.MeshBasicMaterial({
    color: i % 2 === 0 ? 0xff003c : 0x00f0ff,
    transparent: true, opacity: 0.3 - i * 0.04,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const ring = new THREE.Mesh(ringGeometry, ringMaterial);
  ring.rotation.x = Math.random() * Math.PI;
  ring.rotation.y = Math.random() * Math.PI;
  ring.rotation.z = Math.random() * Math.PI;
  ring.userData = {
    rotationSpeed: { x:(Math.random()-.5)*.004, y:(Math.random()-.5)*.004, z:(Math.random()-.5)*.004 },
    pulseSpeed: 0.5 + Math.random() * 0.5,
    pulseOffset: Math.random() * Math.PI * 2
  };
  rings.push(ring);
  scene.add(ring);
}

const cubeWireframe = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(5, 5, 5)),
  new THREE.LineBasicMaterial({ color: 0xff003c, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending, depthWrite: false })
);
cubeWireframe.position.set(-22, -6, -12);
scene.add(cubeWireframe);

const octaWire = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.OctahedronGeometry(4, 0)),
  new THREE.LineBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false })
);
octaWire.position.set(24, 8, -15);
scene.add(octaWire);

let mouseX = 0, mouseY = 0, targetMouseX = 0, targetMouseY = 0;
window.addEventListener('mousemove', function (e) {
  targetMouseX = (e.clientX / window.innerWidth) * 2 - 1;
  targetMouseY = (e.clientY / window.innerHeight) * 2 - 1;
}, { passive: true });
window.addEventListener('touchmove', function (e) {
  if (e.touches.length) {
    targetMouseX = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
    targetMouseY = (e.touches[0].clientY / window.innerHeight) * 2 - 1;
  }
}, { passive: true });

let running = true;
let lastTime = performance.now();
let scrollFactor = 0;
window.addEventListener('scroll', function(){ scrollFactor = window.scrollY * 0.001; }, { passive: true });

function animate(now) {
  if (!running) return;
  const dt = Math.min((now - lastTime) / 16.667, 3);
  lastTime = now;

  mouseX += (targetMouseX - mouseX) * 0.05 * dt;
  mouseY += (targetMouseY - mouseY) * 0.05 * dt;

  particleSystem.rotation.x += 0.0006 * dt;
  particleSystem.rotation.y += 0.0009 * dt;
  particleSystem.rotation.z = scrollFactor * 0.1;

  for (let i = 0; i < rings.length; i++) {
    const ring = rings[i];
    ring.rotation.x += ring.userData.rotationSpeed.x * dt;
    ring.rotation.y += ring.userData.rotationSpeed.y * dt;
    ring.rotation.z += ring.userData.rotationSpeed.z * dt;
    const pulse = Math.sin(now * 0.001 * ring.userData.pulseSpeed + ring.userData.pulseOffset) * 0.3 + 1;
    ring.scale.setScalar(pulse);
    ring.material.opacity = (0.3 - i * 0.04) * pulse;
  }

  cubeWireframe.rotation.x += 0.003 * dt;
  cubeWireframe.rotation.y += 0.005 * dt;
  octaWire.rotation.x += 0.002 * dt;
  octaWire.rotation.y += 0.004 * dt;

  camera.position.x += (mouseX * 3 - camera.position.x) * 0.025 * dt;
  camera.position.y += (-mouseY * 2 - camera.position.y) * 0.025 * dt;
  camera.position.z = 30 + scrollFactor * 2;
  camera.lookAt(scene.position);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

let resizeTimer;
window.addEventListener('resize', function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }, 200);
}, { passive: true });

document.addEventListener('visibilitychange', function () {
  if (document.hidden) { running = false; }
  else { running = true; lastTime = performance.now(); requestAnimationFrame(animate); }
});

if ('getBattery' in navigator) {
  navigator.getBattery().then(function (b) {
    function update() {
      if (b.level < 0.15 && !b.charging) {
        running = false;
        particleSystem.visible = false;
        rings.forEach(function (r) { r.visible = false; });
        cubeWireframe.visible = false; octaWire.visible = false;
      } else if (!document.hidden) {
        running = true;
        particleSystem.visible = true;
        rings.forEach(function (r) { r.visible = true; });
        cubeWireframe.visible = true; octaWire.visible = true;
        lastTime = performance.now();
        requestAnimationFrame(animate);
      }
    }
    b.addEventListener('levelchange', update);
    b.addEventListener('chargingchange', update);
  }).catch(function () {});
}

requestAnimationFrame(animate);

// Anti-DOM manipulation
const observer = new MutationObserver(function (mutations) {
  for (let i = 0; i < mutations.length; i++) {
    const m = mutations[i];
    if (m.type === 'childList') {
      for (let j = 0; j < m.addedNodes.length; j++) {
        const node = m.addedNodes[j];
        if (node.nodeType === 1 && node.tagName === 'SCRIPT' && !node.hasAttribute('data-allowed')) {
          node.remove();
        }
      }
    }
  }
});
observer.observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
</body>
